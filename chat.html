<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Vision Chat - Find Your Location</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #0054A4 0%, #00AEEF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            height: 80vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #0054A4 0%, #00AEEF 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: none;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.user .message-content {
            background: #0054A4;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.bot .message-content a {
            color: #0054A4;
            text-decoration: none;
            font-weight: 500;
        }

        .message.bot .message-content a:hover {
            text-decoration: underline;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 12px;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0054A4;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
            resize: none;
            max-height: 100px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #0054A4;
        }

        .send-button {
            background: #0054A4;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background: #00AEEF;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .suggestion {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .suggestion:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }

            .message-content {
                max-width: 90%;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            z-index: 10;
        }

        .back-button:hover {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            .back-button {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='/'">← Back</button>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>Total Vision Chat</h1>
            <p>Ask about our locations, hours, doctors, and services</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <div class="empty-state-icon">👁️</div>
                <h2>Welcome to Total Vision</h2>
                <p>Ask me anything about our eye care practices across California</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="sendMessage('What are your office hours?')">Office hours</div>
                    <div class="suggestion" onclick="sendMessage('Do you accept insurance?')">Insurance info</div>
                    <div class="suggestion" onclick="sendMessage('Where is your closest location?')">Find location</div>
                    <div class="suggestion" onclick="sendMessage('What services do you offer?')">Services</div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="chatInput"
                    class="chat-input"
                    placeholder="Ask about locations, hours, doctors..."
                    onkeypress="handleKeyPress(event)"
                />
                <button id="sendButton" class="send-button" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M16.6915026,11.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,17.1272231 C0.8376543,17.7415457 0.99,18.3559441 1.77946707,18.5130414 L18.5347953,3.02191125 C19.3242624,2.40760377 19.3242624,1.27347118 18.5347953,0.9915502 L1.77946707,0.9915502 C0.994999974,0.148514616 0.837030787,0.9915502 1.15159189,1.60585768 L3.03521743,5.1589241 C3.03521743,5.31601848 3.34915502,5.4731159 3.50612381,5.4731159 L16.6915026,7.25860288 C16.6915026,7.25860288 17.1272231,7.25860288 17.1272231,7.4157003 L17.1272231,11.3173775 C17.1272231,11.4744748 16.6915026,11.4744748 16.6915026,11.4744748 Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        let isLoading = false;

        const practicesData = [{"id":"11010-bonita","name":"Bonita","location":"180 Otay Lakes Rd Suite 201, Bonita CA, 91902","phone":"619-267-9900","hours":{"monday":"8:00am - 5:00pm","tuesday":"8:00am - 5:00pm","wednesday":"8:00am - 5:00pm","thursday":"8:00am - 5:00pm","friday":"8:00am - 4:00pm","saturday":"8:00am - 12:00pm","sunday":"CLOSED"},"doctors":["Dr. Henry Kikunaga (Mon-Sat)"]},{"id":"13510-camarillo","name":"Camarillo","location":"2380 Las Posas Rd, Camarillo, CA 93010","phone":"805-987-2400","hours":{"monday":"8:30am - 5:00pm","tuesday":"8:30am - 5:30pm","wednesday":"8:30am - 6:00pm","thursday":"9:40am - 5:30pm","friday":"8:30am - 5:00pm","saturday":"8:00am - 2:00pm"},"doctors":["Dr. Martin Schneider","Dr. Victoria Chow","Dr. Jonathan Mak"]},{"id":"13610-campbell","name":"Campbell","location":"338 E. Hamilton Ave Campbell CA 95008","phone":"408-866-2020","hours":{"monday":"9:00am - 6:00pm","tuesday":"9:00am - 6:00pm","wednesday":"9:00am - 6:00pm","thursday":"9:00am - 6:00pm","friday":"9:00am - 5:00pm","saturday":"8:00am - 3:00pm"},"doctors":["Dr. Albert Chang","Dr. Gilbert Ruiz","Dr. Cheng-Yi Tuan"]},{"id":"12210-carlsbad","name":"Carlsbad Plaza","location":"2540 El Camino Real Suite B, Carlsbad, CA 92008","phone":"760-729-9353","hours":{"monday":"9:00am - 6:00pm","tuesday":"9:00am - 6:00pm","wednesday":"9:00am - 5:00pm","thursday":"9:00am - 6:00pm","friday":"9:00am - 5:00pm"},"doctors":["Dr. Vanessa Kashak"]},{"id":"11610-huntington","name":"Huntington Beach","location":"5092 Warner Ave. Huntington Beach, CA 92649","phone":"714-794-3734","hours":{"monday":"9:00am - 5:00pm","tuesday":"9:00am - 5:00pm","wednesday":"9:00am - 5:00pm","thursday":"9:00am - 5:00pm","friday":"9:00am - 5:00pm"},"doctors":["Dr. Paul Blaze","Dr. Michael Dao","Dr. Joseph Ridenour"]},{"id":"12510-chino","name":"Chino Hills","location":"2581 Chino Hills Parkway, Chino Hills CA 91709","phone":"909-393-8378","hours":{"monday":"8:30am - 5:00pm","tuesday":"8:30am - 5:00pm","wednesday":"8:30am - 5:00pm","thursday":"8:30am - 5:00pm","friday":"8:30am - 5:00pm","saturday":"8:30am - 2:00pm"},"doctors":["Dr. Jon Crum"]},{"id":"13210-culver","name":"Culver City","location":"12461 W. Washington Blvd., Los Angeles, CA 90066","phone":"310-390-6287","hours":{"monday":"9:00am - 5:30pm","tuesday":"8:00am - 4:30pm","wednesday":"8:00am - 4:30pm","thursday":"9:00am - 5:30pm","friday":"8:00am - 4:30pm"},"doctors":["Dr. Cynthia Arata","Dr. Irene Yim"]}];

        function generateResponse(userMsg) {
          const msg = userMsg.toLowerCase();
          
          if (msg.includes('hour') || msg.includes('open') || msg.includes('close')) {
            let response = 'Here are our office hours:\n\n';
            practicesData.forEach(p => {
              response += `${p.name}: Mon ${p.hours.monday || 'Closed'}, Sat ${p.hours.saturday || 'Closed'}\n`;
            });
            return response + '\nCall us at 1-800-VISION for specific hours.';
          }
          
          if (msg.includes('doctor') || msg.includes('optometrist') || msg.includes('staff')) {
            let response = 'Our experienced doctors:\n\n';
            const doctors = new Set();
            practicesData.forEach(p => {
              p.doctors.forEach(d => doctors.add(d));
            });
            doctors.forEach(d => response += `• ${d}\n`);
            return response;
          }
          
          if (msg.includes('location') || msg.includes('where') || msg.includes('address')) {
            let response = 'We have 7 locations:\n\n';
            practicesData.forEach(p => {
              response += `${p.name} - ${p.location}\nPhone: ${p.phone}\n\n`;
            });
            return response;
          }
          
          if (msg.includes('bonita')) {
            const loc = practicesData.find(p => p.name.includes('Bonita'));
            return `${loc.name}\nLocation: ${loc.location}\nPhone: ${loc.phone}\nHours: M-F 8am-5pm, Sat 8am-12pm\nDoctors: ${loc.doctors.join(', ')}`;
          }
          
          if (msg.includes('service') || msg.includes('offer') || msg.includes('exam')) {
            return 'We offer comprehensive eye exams, contact lens fittings, eyeglasses, and treatment for various eye conditions. Call us for more details!';
          }
          
          if (msg.includes('phone') || msg.includes('call') || msg.includes('contact')) {
            return 'Call us at 1-800-VISION or visit our website at www.totalvisionllc.com';
          }
          
          return 'Hi! I can help you with information about our locations, hours, doctors, and services. What would you like to know?';
        }

        async function sendMessage(message = null) {
            const userMessage = message || chatInput.value.trim();
            
            if (!userMessage || isLoading) return;

            // Clear input
            chatInput.value = '';
            
            // Remove empty state if present
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            // Add user message
            addMessage(userMessage, 'user');

            // Show loading
            setLoading(true);

            try {
                // Generate response locally - no API call needed
                const botResponse = generateResponse(userMessage);
                setTimeout(() => {
                    setLoading(false);
                    addMessage(botResponse, 'bot');
                    chatInput.focus();
                }, 500);
            } catch (error) {
                console.error('[v0] Chat error:', error);
                setLoading(false);
                addMessage('Sorry, something went wrong. Please try again.', 'bot');
                chatInput.focus();
            }
        }
                chatInput.focus();
            }
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Auto scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function getConversationHistory() {
            const messages = [];
            const messageElements = messagesContainer.querySelectorAll('.message');
            
            messageElements.forEach(el => {
                const role = el.classList.contains('user') ? 'user' : 'assistant';
                const content = el.querySelector('.message-content').textContent;
                messages.push({ role, content });
            });
            
            return messages;
        }

        function setLoading(loading) {
            isLoading = loading;
            sendButton.disabled = loading;

            if (loading) {
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message bot';
                loadingDiv.innerHTML = '<div class="loading-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
                messagesContainer.appendChild(loadingDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } else {
                const loadingDiv = messagesContainer.querySelector('.loading-indicator');
                if (loadingDiv) {
                    loadingDiv.parentElement.remove();
                }
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Focus input on load
        chatInput.focus();
    </script>
</body>
</html>
